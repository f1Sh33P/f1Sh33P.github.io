  <blockquote>
    <p>蓝青峰：正经人谁写日记啊？</p>
    <p>朱潜龙：是啊</p>
    <p>蓝：你写日记吗？</p>
    <p>朱：我不写</p>
    <p>朱：你写日记吗？</p>
    <p>蓝：谁能把心里话写日记里？</p>
    <p>朱：写出来的那能叫心里话？</p>
    <p>蓝、朱：下贱！</p>
    <p style="text-align: right;">姜文《邪不压正》</p>
  </blockquote>

一个人要变得赤裸，然后才能看见自己的贫瘠。
