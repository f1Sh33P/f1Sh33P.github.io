我的网站共三个版块，分别是基础信息（meta）、我（ego）与世界（world）。

核心原则：

1. 这不是我的网站，这就是我。

2. 如无必要，勿增实体。

3. 形式服务于内容。

4. 写自己能力范围内的代码。

当然，有原则就会有例外。我扪心自问：准备好构建一座屎山了吗？

Q&A

Q：我的网站更多关于「表达自己、寻求关注」，还是「尝试构建一个完备、自洽的世界」？

A：我想后者要更多一些。尽管我并不幻想自己能够成功，但我必须立即开始行动。
